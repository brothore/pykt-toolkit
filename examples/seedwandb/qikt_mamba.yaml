program: wandb_qikt_mamba_train.py
method: bayes
metric:
    goal: maximize
    name: validauc
parameters:
    model_name:
        values: ["qikt_mamba"]
        
    # ==========================================
    # ⚠️ 脚本占位符 (请勿修改，用于generate_wandb.py替换)
    # ==========================================
    dataset_name:
        values: ["xes"]            # 脚本会将 "xes" 替换为具体数据集名 (如 assist2009)
    emb_type:
        values: ["diff"]            # 脚本会将 "qid" 替换为 "diff" (如果你在命令行指定了)
    save_dir:
        values: ["models/xdkt_tiaocan"] # 脚本会处理后缀
    fold:
        values: [0, 1, 2, 3, 4]    # 脚本会处理具体的 fold

    # ==========================================
    # 🔒 锁定参数 (根据你的运行命令固定)
    # ==========================================
    emb_size:
        values: [256,128,64,32]              # 命令中统一为 256
    batch_size:
        values: [32]
    output_mode:
        values: ['an_irt']         # 命令中修改为 'an_irt'
    version:
        values: ['dimkt']          # 新增: 命令中使用的版本

    # ==========================================
    # 🔍 搜索/调优空间 (根据命令中的变化值设定)
    # ==========================================
    learning_rate:
        values: [1e-3, 1e-4, 1e-5]            # 命令中统一为 0.0001
    dropout:
        values: [0.05,0.1,0.3,0.5]        # 命令中分别使用了 0.3 和 0.5
    seed:
        values: [42, 3407]         # 命令中分别使用了 42 和 3407
    
    # Loss Lambda (结合了你不同命令中的取值 0.5, 1.0, 1.5, 2.0)
    loss_c_all_lambda:
        values: [0.5, 1.0,1.5, 2.0]         # 命令中用过 1.0 和 0.5
    loss_q_all_lambda:
        values: [0.5, 1.0,1.5, 2.0]              # 命令中似乎固定 1.0
    loss_c_next_lambda:
        values: [0.5, 1.0,1.5, 2.0]       # 命令中用过 2 和 1.5

    output_mode:
        values: ['OUTPUT_MODEL']
    batch_size:
        values: [32]