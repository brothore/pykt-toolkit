program: wandb_qikt_iekt_dual_gae_v2_train.py
method: bayes
metric:
    goal: maximize
    name: validauc
parameters:
    model_name:
        values: ["qikt_iekt_dual_gae_v2"]
        
    # ==========================================
    # ⚠️ 脚本占位符 (请勿修改，用于generate_wandb.py替换)
    # ==========================================
    dataset_name:
        values: ["xes"]            # 脚本会将 "xes" 替换为具体数据集名 (如 assist2009)
    emb_type:
        values: ["iekt"]            # 脚本会将 "qid" 替换为 "diff" (如果你在命令行指定了)
    save_dir:
        values: ["models/xdkt_tiaocan"] # 脚本会处理后缀
    fold:
        values: [0, 1, 2, 3, 4]    # 脚本会处理具体的 fold

    # ==========================================
    # 🔒 锁定参数 (根据你的运行命令固定)
    # ==========================================
    emb_size:
        values: [256]              # 命令中统一为 256
    batch_size:
        values: [32]
    output_mode:
        values: ["an_irt"]         # 命令中修改为 'an_irt'
    version:
        values: ["iekt"]          # 新增: 命令中使用的版本

    # ==========================================
    # 🔍 搜索/调优空间 (根据命令中的变化值设定)
    # ==========================================
    learning_rate:
        values: [3e-4]            # 命令中统一为 0.0001
    dropout:
        values: [0.3]        # 命令中分别使用了 0.3 和 0.5
    seed:
        values: [42]         # 命令中分别使用了 42 和 3407
    
    # Loss Lambda (结合了你不同命令中的取值 0.5, 1.0, 1.5, 2.0)
    loss_c_all_lambda:
        values: [ 1]         # 命令中用过 1.0 和 0.5
    loss_q_all_lambda:
        values: [0.5]              # 命令中似乎固定 1.0
    loss_c_next_lambda:
        values: [1.5]       # 命令中用过 2 和 1.5
    acq_levels:
        values: [10]
    gamma:
        values: [0.2,0.4,0.6,0.8,0.95]
    cog_levels:
        values: [10]
    lambda_rl:
        values: [0.05,0.1,0.3,0.5]
    lam:
        values: [0.95]
    output_mode:
        values: ['OUTPUT_MODEL']
